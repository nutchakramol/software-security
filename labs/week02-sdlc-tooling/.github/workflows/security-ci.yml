# Week 2 — Security CI gate (Task 6)
# Adapted from labs/week15-devsecops-pipeline/security-ci.yml
# Runs Semgrep + Trivy + Gitleaks; fails the build on any HIGH/CRITICAL finding or leaked secret.

name: security-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. SAST ────────────────────────────────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan → SARIF
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --error || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Gate: non-zero exit when findings exist → build fails
      - name: Gate — fail on Semgrep findings
        run: semgrep scan --config p/default --config p/owasp-top-ten --error

  # ── 2. SCA + IaC (Trivy) ───────────────────────────────────────────────────
  trivy:
    name: SCA + IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy fs → SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Gate: re-scan with exit-code 1 so HIGH/CRITICAL breaks the build
      - name: Gate — fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

  # ── 3. Secret scanning (Gitleaks) ──────────────────────────────────────────
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so buried secrets are caught

      - name: Gitleaks scan → SARIF
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect -s /repo \
            --report-format sarif --report-path /repo/gitleaks.sarif \
            --exit-code 0 -v || true

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # Gate: any secret → build fails
      - name: Gate — fail if secret found
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect -s /repo --exit-code 1 -v
